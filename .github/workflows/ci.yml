# Runs the core tests on pull requests and pushes to main. Releases come from release.yml (tags only).
name: Tests

on:
  pull_request:
    paths: ["Sources/**", "Tests/**", "Package.swift", "Package.resolved", "docs/**", ".github/workflows/ci.yml", "scripts/ci-test.sh"]
  push:
    branches: [main]
    paths: ["Sources/**", "Tests/**", "Package.swift", "Package.resolved", "docs/**", ".github/workflows/ci.yml", "scripts/ci-test.sh"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: ./scripts/ci-select-xcode.sh
      - name: Test
        # Every test, including those that take focus or show windows: nobody is using this Mac. The script retries a
        # run that wedges as it starts, with a stack sample in the log.
        run: LAMINA_UI_TESTS=1 ./scripts/ci-test.sh --disable-keychain
