<!doctype html>
<!--
  Source of web/assets/og-image.jpg (1200x630 card rendered at 2x). Re-render to PNG, then convert:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=2 --window-size=1200,630 \
    --screenshot=/tmp/og.png "file://$PWD/scripts/og-image.html"
  sips -s format jpeg -s formatOptions 86 /tmp/og.png --out web/assets/og-image.jpg
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lamina social card</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        background:
          radial-gradient(60% 55% at 50% 80%, rgb(240 138 74 / 0.34), transparent),
          radial-gradient(40% 40% at 50% 0%, rgb(242 81 46 / 0.14), transparent), #15100d;
        color: #f3ebe5;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }

      .icon {
        width: 76px;
        height: 76px;
        margin-top: 40px;
        filter: drop-shadow(0 10px 18px rgb(0 0 0 / 0.5));
      }

      .pill {
        margin: 16px 0 0;
        padding: 3px 12px;
        border: 1px solid #36281f;
        border-radius: 999px;
        background: #221913;
        color: #b5a397;
        font-size: 15px;
      }

      h1 {
        margin: 14px 0 0;
        font-size: 58px;
        line-height: 1.04;
        letter-spacing: -0.035em;
        font-weight: 700;
      }

      p.lead {
        max-width: 800px;
        margin: 16px 0 0;
        color: #b5a397;
        font-size: 21px;
        line-height: 1.45;
      }

      .shot {
        position: absolute;
        left: 50%;
        top: 418px;
        width: 1040px;
        transform: translateX(-50%);
        filter: drop-shadow(0 -6px 40px rgb(0 0 0 / 0.55));
      }
    </style>
  </head>
  <body>
    <img class="icon" src="../web/assets/icon.png" alt="" />
    <p class="pill">Free &amp; open source · macOS 26 · Under 50 MB</p>
    <h1>Photo editing and compositing,<br />without the bloat.</h1>
    <p class="lead">
      Layers, masks, adjustment layers, Camera Raw, brushes and text, in a layout you already know. No subscription,
      no account, and ready for AI agents.
    </p>
    <img class="shot" src="../web/assets/screenshot.webp" alt="" />
  </body>
</html>
